const DEFAULT={name:'The Great Gary Blanket',width:60,length:93,pegs:36,done:true,currentRow:0,photo:'',yarn:[{id:'white',name:'White',brand:'Yarn Bee Eternal Bliss',color:'#f4efe5',bought:9,left:3,price:93.59/17,notes:'Hobby Lobby; combined White + Truffle purchase $93.59 / 17 skeins',rowsPerSkein:7},{id:'truffle',name:'Truffle',brand:'Yarn Bee Eternal Bliss',color:'#947867',bought:8,left:4,price:93.59/17,notes:'Hobby Lobby; track sale vs regular purchases',rowsPerSkein:7},{id:'gary',name:'Gary (Gray)',brand:'Mystery Amazon Gray',color:'#393940',bought:9,left:3,price:35/12,notes:'Amazon sale: 12 skeins for $35; observed 7–8 rows/skein',rowsPerSkein:8}],sections:[['white',7],['gary',2],['white',1],['truffle',2],['white',1],['gary',13],['white',2],['truffle',2],['white',2],['truffle',13],['white',7],['gary',18],['white',7],['truffle',13],['white',2],['truffle',2],['white',2],['gary',13],['white',1],['truffle',2],['white',1],['gary',2],['white',7]].map(([yarn,rows])=>({yarn,rows})),notes:'Finished September 2026. First Chunky prototype project! Actual middle was 18 rows of Gary.',giftedTo:''};
const KEY='chunky-prototype-v2', OLD_KEY='chunky-prototype-v1';
let db,state;
function init(){try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!db||!Array.isArray(db.projects)){
 let old;try{old=JSON.parse(localStorage.getItem(OLD_KEY))}catch(e){};
 let first=old||structuredClone(DEFAULT);first.id='gary-001';first.usage=Object.fromEntries((first.yarn||DEFAULT.yarn).map(y=>[y.id,Math.max(0,Number(y.bought||0)-Number(y.left||0))]));
 db={version:2,activeId:first.id,yarn:first.yarn||structuredClone(DEFAULT.yarn),projects:[first]};
 }if(!Array.isArray(db.yarn))db.yarn=structuredClone(DEFAULT.yarn);if(!db.projects.length){db.projects=[structuredClone(DEFAULT)];db.projects[0].id='gary-001'}

}init();let tab='home', mirrorPreview=false, previewStyle='knit', compareA=null, compareB=null;let scanImage='',scanFile=null,scanDraft={};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'$'+Number(n||0).toFixed(2),totalRows=()=>state.sections.reduce((s,x)=>s+Number(x.rows||0),0),yarn=id=>db.yarn.find(x=>x.id===id)||{name:'Unknown',color:'#ddd'};function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function go(t){tab=t;render();window.scrollTo(0,0)}function cost(){return db.yarn.reduce((s,y)=>s+Number((state.usage||{})[y.id]||0)*Number(y.price||0),0)}function pattern(mirror=false){let s=state.sections.slice();if(mirror)s=s.concat(s.slice().reverse());return s}function preview(sections,compact=false,style=previewStyle){let max=sections.reduce((s,x)=>s+Number(x.rows||0),0)||1;let height=compact?240:460;let rows=sections.map(x=>{let c=yarn(x.yarn).color;let h=Math.max(compact?2:4,Number(x.rows||0)*height/max);return `<div title="${esc(yarn(x.yarn).name)} · ${x.rows} rows" class="stripe ${style==='knit'?'knit-texture':''}" style="height:${h}px;background-color:${c}"></div>`}).join('');return `<div class="blanket ${style==='knit'?'knit-border':''}" style="width:${compact?'170px':'100%'}" role="img" aria-label="Blanket preview with ${sections.length} color sections">${rows}</div>`}

function shuffleCompareB(){let ids=db.yarn.map(y=>y.id);if(!ids.length)return;compareB=compareB.map(s=>s.locked?{...s}:{...s,yarn:ids[Math.floor(Math.random()*ids.length)]});render()}
function metrics(){return `<div class="metrics"><div class="metric"><strong>${state.width}″ × ${state.length}″</strong><span>Finished size</span></div><div class="metric"><strong>${db.yarn.reduce((s,y)=>s+Number((state.usage||{})[y.id]||0),0)}</strong><span>Skeins used</span></div><div class="metric"><strong>${money(cost())}</strong><span>Est. yarn cost</span></div></div>`}function baseHome(){return `<div class="hero"><span class="pill">${state.done?'✓ COMPLETE':'IN PROGRESS'}</span><h1 style="margin:12px 0 4px">${esc(state.name)}</h1><p class="muted">Your blanket, your colors, your rules. 🧶</p>${state.photo?`<img class="thumb" src="${state.photo}" alt="Finished blanket">`:`<div style="display:flex;justify-content:center">${preview(state.sections,true)}</div>`}<div style="margin-top:15px">${metrics()}</div><div class="flex" style="margin-top:14px"><button onclick="go('projects')">My blankets / + New</button><button onclick="go('design')">${state.done?'View pattern':'Edit pattern'}</button>${!state.done?'<button onclick="startKnitting()">🧶 Start knitting</button>':''}<button class="secondary" onclick="go('receipt')">Blanket receipt</button></div></div><div class="panel"><h2>What do you want to do?</h2><div class="grid"><button onclick="go('projects')">➕ Start a new blanket</button><button onclick="go('design')">🎨 Design my blanket</button><button onclick="go('stash')">🧶 My yarn stash</button><button onclick="go('scan')">📸 Add yarn from screenshot</button><button onclick="go('knit')">🔢 Row counter</button><button onclick="go('receipt')">💰 Blanket receipt</button></div></div><div class="panel"><h3>Project details</h3><div class="flex"><div class="field"><label>Project name</label><input value="${esc(state.name)}" ${state.done?'disabled':''} onchange="state.name=this.value;save()"></div><div class="field"><label>Gifted to</label><input placeholder="Who received it?" value="${esc(state.giftedTo)}" onchange="state.giftedTo=this.value;save()"></div></div><div class="flex"><div class="field"><label>Width (inches)</label><input type="number" min="1" value="${state.width}" ${state.done?'disabled':''} onchange="state.width=+this.value;save()"></div><div class="field"><label>Length (inches)</label><input type="number" min="1" value="${state.length}" ${state.done?'disabled':''} onchange="state.length=+this.value;save()"></div><div class="field"><label>Loom pegs</label><input type="number" min="1" value="${state.pegs}" ${state.done?'disabled':''} onchange="state.pegs=+this.value;save()"></div></div><div class="field"><label>Finished blanket photo (saved on this device)</label><input type="file" accept="image/*" onchange="uploadPhoto(this)"></div><label class="flex"><input style="width:auto" type="checkbox" ${state.done?'checked':''} onchange="state.done=this.checked;save()"> Mark project complete</label><div class="field"><label>Notes</label><input value="${esc(state.notes)}" onchange="state.notes=this.value;save()"></div></div>`}function startKnitting(){if(!state.sections.length){alert('Add at least one stripe before starting.');return;}state.started=true;state.startedAt=state.startedAt||new Date().toISOString();tab='knit';save();window.scrollTo(0,0)}function design(){if(state.done)return `<div class="panel"><h1>🔒 ${esc(state.name)}</h1><p>This completed blanket is protected. Create a new design or duplicate its pattern to experiment without changing Gary.</p><div class="flex"><button onclick="newProject(true)">Duplicate as new design</button><button class="secondary" onclick="go('projects')">My blankets</button></div><div style="margin-top:16px">${preview(state.sections)}</div></div>`;let secs=pattern(mirrorPreview);return `<div class="panel"><h1>Blanket Designer 🎨</h1><div class="panel" style="background:#eee6db"><strong>Ready to make this blanket?</strong><p class="hint">Your design is saved separately from Gary. Start knitting whenever you’re happy with the stripes.</p><button onclick="startKnitting()" ${state.sections.length?'':'disabled'}>🧶 Start knitting →</button></div><p class="muted">Change stripe colors and row counts. Try a true center mirror without losing your original pattern.</p><div class="flex"><button class="${mirrorPreview?'':'secondary'}" onclick="mirrorPreview=!mirrorPreview;render()">↔ ${mirrorPreview?'Showing mirrored preview':'Preview mirror at center'}</button><button class="secondary" onclick="shuffle()">⇄ Shuffle unlocked colors</button><button class="ghost" onclick="if(confirm('Replace pattern with a simple sample?')){state.sections=[{yarn:'white',rows:7},{yarn:'gary',rows:13},{yarn:'white',rows:2},{yarn:'truffle',rows:13},{yarn:'white',rows:7}];save()}">Try sample</button></div>${stashEstimate(secs)}<div class="grid" style="align-items:start;margin-top:18px"><div><h3>Live preview</h3>${previewControls()}${preview(secs)}<p class="hint" style="text-align:center">${secs.reduce((s,x)=>s+x.rows,0)} rows ${mirrorPreview?'· full mirrored preview':''}</p></div><div><h3>Stripe sequence (${state.sections.length} sections)</h3><div style="max-height:570px;overflow:auto">${state.sections.map((x,i)=>`<div class="row"><span class="swatch" style="background:${yarn(x.yarn).color}"></span><span class="hint">${i+1}</span><select aria-label="Color for section ${i+1}" style="max-width:145px" onchange="state.sections[${i}].yarn=this.value;save()">${db.yarn.map(y=>`<option value="${y.id}" ${x.yarn===y.id?'selected':''}>${esc(y.name)}</option>`).join('')}</select><input aria-label="Rows" type="number" min="1" max="100" style="width:67px" value="${x.rows}" onchange="state.sections[${i}].rows=Math.max(1,+this.value);save()"><button class="small secondary" title="Move stripe up" aria-label="Move stripe up" onclick="moveStripe(${i},-1)" ${i===0?'disabled':''}>↑</button><button class="small secondary" title="Move stripe down" aria-label="Move stripe down" onclick="moveStripe(${i},1)" ${i===state.sections.length-1?'disabled':''}>↓</button><button class="small ${x.locked?'':'secondary'}" title="Lock stripe against shuffle" aria-label="Lock stripe against shuffle" onclick="state.sections[${i}].locked=!state.sections[${i}].locked;save()">${x.locked?'🔒':'🔓'}</button><button class="small danger" onclick="state.sections.splice(${i},1);save()">×</button></div>`).join('')}</div><div class="flex" style="margin-top:12px"><button onclick="state.sections.push({yarn:db.yarn[0].id,rows:2});save()">+ Add stripe</button><button class="secondary" onclick="if(confirm('Append a reversed copy of every current section?')){state.sections=pattern(true);mirrorPreview=false;save()}">Apply mirror</button></div><p class="hint">Use ↑ ↓ to reorder stripes, and 🔒 to protect favorites when shuffling. Yarn check above includes the mirror when preview is on.</p><p class="hint">New design? Start by tapping + Add stripe, then choose colors from your shared yarn stash. Apply mirror only if your list contains the first half. If the center stripe is a single continuous block, split it evenly before mirroring.</p></div></div></div>${compareDesigns()}` }function baseKnit(){let total=totalRows(),done=Math.min(state.currentRow,total),sum=0,next=state.sections.find(s=>(sum+=s.rows)>done),at=next?sum-next.rows:total;return `<div class="panel"><h1>Row Counter 🔢</h1><p class="muted">${state.started?'Your project is underway! Pick up where you left off.':'Preview your rows, or tap Start knitting to begin.'}</p>${!state.started&&!state.done?'<button onclick="startKnitting()">🧶 Start knitting</button>':''}<div class="counter">${done}</div><p style="text-align:center" class="muted">of ${total} rows completed</p><div class="progress"><div style="width:${total?100*done/total:0}%"></div></div><div class="panel" style="text-align:center;background:#f3ece3"><p class="muted">${next?'NEXT ROW COLOR':'ALL ROWS COMPLETE'}</p><h2>${next?`<span class="swatch" style="background:${yarn(next.yarn).color}"></span> ${esc(yarn(next.yarn).name)}`:'🎉 Finished!'}</h2><p>${next?`Rows ${at+1}–${sum} · ${sum-done} rows until next color change`:''}</p>${next&&sum<total?`<p class="hint">After that: ${esc(yarn(state.sections[state.sections.indexOf(next)+1]?.yarn).name)}</p>`:''}</div><div class="flex" style="justify-content:center"><button class="secondary" data-row-action="minus">− One row</button><button style="font-size:20px" data-row-action="plus" ${done===total?'disabled':''}>+ Row done</button></div><div class="field"><label>Jump to row</label><input type="number" min="0" max="${total}" value="${done}" data-row-jump="true"></div></div>`}function stash(){return `<div class="panel"><h1>My Yarn Stash 🧶</h1><button onclick="go('scan')">📸 Add from screenshot or label</button><p class="muted">Keep brand, batch price, color, and real rows per skein. Add a new entry for each differently priced purchase.</p>${db.yarn.map((y,i)=>`<div class="panel" style="background:#faf6f0"><div class="flex between"><h3><span class="swatch" style="background:${y.color}"></span> ${esc(y.name)}</h3><button class="small danger" onclick="if(db.projects.some(p=>p.sections.some(s=>s.yarn===db.yarn[${i}].id))){alert('This yarn is used in a blanket pattern. Keep it in your stash for now.')}else if(confirm('Delete this yarn?')){db.yarn.splice(${i},1);save()}">Delete</button></div><div class="field"><label>Yarn / color name</label><input value="${esc(y.name)}" onchange="db.yarn[${i}].name=this.value;save()"></div><div class="field"><label>Brand / listing</label><input value="${esc(y.brand)}" onchange="db.yarn[${i}].brand=this.value;save()"></div><div class="flex"><div class="field"><label>Color</label><input type="color" value="${y.color}" onchange="db.yarn[${i}].color=this.value;save()"></div><div class="field"><label>Purchased</label><input type="number" min="0" value="${y.bought}" onchange="db.yarn[${i}].bought=+this.value;save()"></div><div class="field"><label>Left</label><input type="number" min="0" value="${y.left}" onchange="db.yarn[${i}].left=+this.value;save()"></div></div><div class="flex"><div class="field"><label>Actual price per skein ($)</label><input type="number" min="0" step=".01" value="${Number(y.price).toFixed(2)}" onchange="db.yarn[${i}].price=+this.value;save()"></div><div class="field"><label>Measured rows / skein</label><input type="number" min="0" value="${y.rowsPerSkein||''}" onchange="db.yarn[${i}].rowsPerSkein=+this.value;save()"></div></div><div class="field"><label>Yardage per skein</label><input type="number" min="0" step=".1" value="${y.yards??''}" onchange="db.yarn[${i}].yards=this.value;save()"></div><div class="field"><label>Weight (g)</label><input type="number" min="0" step=".1" value="${y.grams??''}" onchange="db.yarn[${i}].grams=this.value;save()"></div>${y.sourceImage?`<details><summary>Saved label / screenshot</summary><img class="scan-preview" src="${y.sourceImage}" alt="Yarn label screenshot"></details>`:''}<div class="field"><label>Purchase details / product specs</label><input value="${esc(y.notes)}" onchange="db.yarn[${i}].notes=this.value;save()"></div></div>`).join('')}<button onclick="let id='y'+Date.now();db.yarn.push({id,name:'New yarn',brand:'',color:'#bca28e',bought:1,left:1,price:0,notes:'',rowsPerSkein:0});save()">+ Add yarn / purchase batch</button><p class="hint" style="margin-top:10px">Use 📸 Add from screenshot to attach a reference image, paste listing specs and prefill your stash entry. Automatic image text recognition depends on your browser.</p></div>`}function scan(){let d=scanDraft;return `<div class="panel"><h1>📸 Scan My Yarn</h1><p class="muted">Upload a screenshot of an Amazon listing or photograph a yarn label. On supported browsers, try reading text from the picture. Otherwise paste the listing details or fill in the fields below. Check everything before saving.</p><div class="field"><label>1. Screenshot or label photo</label><input type="file" accept="image/*" id="scanFile" onchange="scanPick(this)"></div>${scanImage?`<img class="scan-preview" src="${scanImage}" alt="Uploaded yarn reference screenshot">`:''}<div class="flex" style="margin:12px 0"><button class="secondary" onclick="readScan()" ${scanImage?'':'disabled'}>✨ Try reading photo</button><span class="hint">Photo text recognition is not supported on every browser.</span></div><div class="field"><label>2. Paste product title or specifications (optional)</label><textarea id="scanText" rows="5" placeholder="Paste Amazon product title and specs here, e.g. Brand: ... 28 yards, 227 g, Color: ..." style="width:100%;border:1px solid #d8c7b8;border-radius:10px;padding:12px">${esc(d.raw||'')}</textarea></div><button class="secondary" onclick="scanDraft.raw=$('scanText').value;scanParse();render()">✨ Fill fields from pasted text</button><div class="panel" style="background:#faf6f0;margin-top:15px"><h2>3. Review & add to stash</h2><p class="hint">Anything the listing doesn't show can be left blank. Add separate entries for purchases at different prices.</p><div class="grid">${scanField('Yarn / color name','name','e.g. Charcoal')}${scanField('Brand','brand','e.g. Yarn Bee')}${scanField('Color name','colorName','e.g. Truffle')}${scanField('Yards per skein','yards','28','number')}${scanField('Weight in grams','grams','227','number')}${scanField('Material','material','e.g. polyester')}${scanField('ASIN / product ID','asin','Optional')}${scanField('Product URL','url','Optional')}${scanField('Quantity purchased','quantity','1','number')}${scanField('Total paid ($)','totalPrice','e.g. 35','number')}</div><div class="flex"><div class="field"><label>Yarn color for designer</label><input id="sc-color" type="color" value="${d.hex||'#9b8979'}" onchange="scanDraft.hex=this.value"></div><div class="field"><label>Purchase type</label><select id="sc-sale" onchange="scanDraft.sale=this.value"><option value="unknown" ${d.sale==='unknown'||!d.sale?'selected':''}>Not specified</option><option value="sale" ${d.sale==='sale'?'selected':''}>Sale</option><option value="regular" ${d.sale==='regular'?'selected':''}>Regular price</option><option value="clearance" ${d.sale==='clearance'?'selected':''}>Clearance</option></select></div></div><div class="field"><label>Additional notes</label><input id="sc-notes" value="${esc(d.notes||'')}" oninput="scanDraft.notes=this.value" placeholder="Dye lot, texture, other details"></div><button onclick="scanSave()">🧶 Save to my yarn stash</button><button class="secondary" onclick="scanDraft={};scanImage='';scanFile=null;render()">Clear form</button></div><p class="hint">Your image stays on this device; a small reference copy is included in your Chunky backup when storage allows. Your original screenshot remains in your photos/files.</p></div>`}
function scanField(label,key,placeholder,type='text'){return `<div class="field"><label for="sc-${key}">${label}</label><input id="sc-${key}" type="${type}" ${type==='number'?'min="0" step="any"':''} placeholder="${placeholder}" value="${esc(scanDraft[key]??'')}" oninput="scanDraft['${key}']=this.value"></div>`}
function scanPick(el){let f=el.files[0];if(!f)return;scanFile=f;let reader=new FileReader();reader.onload=()=>{scanImage=reader.result;render()};reader.readAsDataURL(f)}
async function readScan(){if(!scanImage)return;try{if(typeof TextDetector==='undefined'){alert('Your browser does not support reading text directly from photos yet. Paste the Amazon title/specifications below, or enter the fields manually. Your screenshot is still attached.');return}let img=new Image();img.src=scanImage;await img.decode();let blocks=await new TextDetector().detect(img);let raw=blocks.map(b=>b.rawValue).join('\n');if(!raw.trim()){alert('No text found. Paste the listing details instead.');return}scanDraft.raw=(scanDraft.raw?scanDraft.raw+'\n':'')+raw;scanParse();render();alert('Text detected! Please check the details before saving.')}catch(e){alert('Photo text recognition is not available here. Paste specs or fill in the fields manually.')}}
function scanParse(){let s=scanDraft.raw||'',m;function find(rx){let v=s.match(rx);return v&&v[1]?v[1].trim():''}scanDraft.brand ||=find(/(?:brand|manufacturer)\s*[:\-]\s*([^\n,;]+)/i);scanDraft.colorName ||=find(/(?:color|colour|shade)\s*[:\-]\s*([^\n,;]+)/i);scanDraft.material ||=find(/(?:material|fiber|fibre)\s*[:\-]\s*([^\n,;]+)/i);scanDraft.asin ||=find(/\bASIN\s*[:#\-]?\s*([A-Z0-9]{10})\b/i);scanDraft.yards ||=find(/\b(\d+(?:\.\d+)?)\s*(?:yds?\.?|yards?)\b/i);scanDraft.grams ||=find(/\b(\d+(?:\.\d+)?)\s*(?:g|grams?)\b/i);scanDraft.url ||=find(/(https?:\/\/[^\s]+)/i);if(!scanDraft.name){let first=s.split('\n').map(x=>x.trim()).find(x=>x.length>8&&!/^(brand|color|material|asin|weight|length)\s*:/i.test(x));if(first)scanDraft.name=first.slice(0,85)} }
function scanSave(){let d=scanDraft,name=(d.name||d.colorName||'').trim(),qty=Number(d.quantity||1),paid=d.totalPrice===''||d.totalPrice==null?0:Number(d.totalPrice);if(!name){alert('Enter a yarn or color name first.');return}if(!Number.isFinite(qty)||qty<=0||!Number.isFinite(paid)||paid<0){alert('Check quantity and total paid.');return}let img='';if(scanImage){try{let canvas=document.createElement('canvas'),image=new Image();image.onload=()=>{let scale=Math.min(1,380/image.width,500/image.height);canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);let thumb=canvas.toDataURL('image/jpeg',.58);addScannedYarn(thumb)};image.onerror=()=>addScannedYarn('');image.src=scanImage;return}catch(e){}}addScannedYarn('')}
function addScannedYarn(img){let d=scanDraft,qty=Number(d.quantity||1),paid=Number(d.totalPrice||0),id='scan-'+Date.now();let y={id,name:(d.name||d.colorName).trim(),brand:d.brand||'',color:d.hex||'#9b8979',colorName:d.colorName||'',yards:d.yards||'',grams:d.grams||'',material:d.material||'',asin:d.asin||'',url:d.url||'',bought:qty,left:qty,price:paid/qty,notes:[d.sale&&d.sale!=='unknown'?('Purchase: '+d.sale):'',d.notes||'',d.raw?'Source specs: '+d.raw.slice(0,1500):''].filter(Boolean).join(' | '),rowsPerSkein:0,sourceImage:img};db.yarn.push(y);try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){delete y.sourceImage;try{localStorage.setItem(KEY,JSON.stringify(db));alert('Yarn saved without the image because device storage is full. Keep your original screenshot.')}catch(err){db.yarn.pop();alert('Device storage is full. Export a backup and free space, then try again.');return}}scanDraft={};scanImage='';scanFile=null;tab='stash';render();window.scrollTo(0,0)}
function receipt(){let used=db.yarn.map(y=>({...y,used:Number((state.usage||{})[y.id]||0),subtotal:Number((state.usage||{})[y.id]||0)*Number(y.price||0)}));return `<div class="panel"><span class="pill">${state.done?'✓ COMPLETE':'IN PROGRESS'}</span><h1 style="margin-top:12px">Blanket Receipt 💰</h1><h2>${esc(state.name)}</h2>${metrics()}<div style="margin-top:18px">${used.map(y=>`<div class="row"><span class="swatch" style="background:${y.color}"></span><div class="grow"><strong>${esc(y.name)}</strong><div class="hint">${y.used} skeins × ${money(y.price)}</div></div><strong>${money(y.subtotal)}</strong></div>`).join('')}</div><div class="panel" style="background:#eee6db"><div class="flex between"><strong>Estimated material cost</strong><h1 style="margin:0">${money(cost())}</h1></div><div class="hint">Inventory purchase value: ${money(db.yarn.reduce((s,y)=>s+y.bought*y.price,0))} · Remaining stash value: ${money(db.yarn.reduce((s,y)=>s+y.left*y.price,0))}</div><p class="hint">Project yarn usage (skeins):</p>${db.yarn.map(y=>`<div class="flex" style="margin:6px 0"><span class="swatch" style="background:${y.color}"></span><label style="flex:1">${esc(y.name)}</label><input style="max-width:95px" type="number" min="0" step="0.1" value="${Number((state.usage||{})[y.id]||0)}" onchange="state.usage=state.usage||{};state.usage['${y.id}']=Math.max(0,Number(this.value)||0);save()"></div>`).join('')}</div><p class="hint">This estimate uses the skeins logged for this project and the prices recorded for each yarn. Partial skeins, tax, shipping and labor aren't included.</p><button onclick="download('chunky-blanket-receipt.txt',receiptText(),'text/plain')">↓ Save receipt</button></div>`}function receiptText(){return `CHUNKY — ${state.name}\nSize: ${state.length} x ${state.width} inches\n${db.yarn.map(y=>`${y.name}: ${Number((state.usage||{})[y.id]||0)} skeins x ${money(y.price)} = ${money(Number((state.usage||{})[y.id]||0)*y.price)}`).join('\n')}\nEstimated total: ${money(cost())}\nGifted to: ${state.giftedTo||'Not entered'}\nNotes: ${state.notes}\n`};function download(name,data,type){let blob=new Blob([data],{type}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function shuffle(){let ids=db.yarn.map(y=>y.id);if(!ids.length)return;state.sections=state.sections.map(s=>s.locked?s:({...s,yarn:ids[Math.floor(Math.random()*ids.length)]}));save()}function moveStripe(i,delta){let j=i+delta;if(j<0||j>=state.sections.length)return;[state.sections[i],state.sections[j]]=[state.sections[j],state.sections[i]];save()}function stashEstimate(sections){let totals={};sections.forEach(s=>totals[s.yarn]=(totals[s.yarn]||0)+Number(s.rows||0));return `<div class="panel" style="background:#f6eee5"><h3>🧶 Yarn check — use what I have</h3><p class="hint">Estimates use your recorded rows per skein. Check your loom width and tension before buying.</p>${Object.entries(totals).map(([id,rows])=>{let y=yarn(id),g=Number(y.rowsPerSkein||0),need=g?rows/g:0,have=Number(y.left||0),short=g&&need>have;return `<div class="row"><span class="swatch" style="background:${y.color}"></span><div class="grow"><strong>${esc(y.name)}</strong><div class="hint">${rows} rows · ${g?'~'+need.toFixed(1)+' skeins needed':'Set rows per skein in Stash'} · ${have} in stash</div></div>${g?`<span class="pill" style="background:${short?'#f8dfd8':'#dfead9'};color:${short?'#8a3b28':'#45653b'}">${short?'Need ~'+(need-have).toFixed(1)+' more':'✓ Enough'}</span>`:''}</div>`}).join('')}</div>`}function uploadPhoto(el){let file=el.files[0];if(!file)return;let img=new Image(),reader=new FileReader();reader.onload=()=>{img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,1100/img.width);c.width=img.width*scale;c.height=img.height*scale;c.getContext('2d').drawImage(img,0,0,c.width,c.height);state.photo=c.toDataURL('image/jpeg',.7);try{save()}catch(e){alert('Photo is too large for local storage. Try a smaller one.')}};img.src=reader.result};reader.readAsDataURL(file)}function baseProjects(){return `<div class="panel"><h1>My Blankets 🧶</h1><p class="muted">Your finished blankets and new designs are kept separate. Gary stays safe!</p><div class="flex"><button onclick="newProject(false)">+ New blank design</button><button class="secondary" onclick="newProject(true)">Duplicate current pattern</button></div></div>${db.projects.map(p=>`<div class="panel"><div class="flex between"><div><span class="pill">${p.done?'✓ Finished':p.started?'🧶 Knitting':'🎨 Designing'}</span><h2 style="margin:10px 0 5px">${esc(p.name)}</h2><p class="muted">${p.width||'—'}″ × ${p.length||'—'}″ · ${(p.sections||[]).reduce((n,s)=>n+Number(s.rows||0),0)} planned rows</p></div>${p.photo?`<img src="${p.photo}" style="width:85px;height:100px;object-fit:cover;border-radius:10px">`:''}</div><div class="flex"><button onclick="openProject('${p.id}')">${p.id===state.id?'✓ Current project':'Open project'}</button>${p.done?`<button class="secondary" onclick="duplicateProject('${p.id}')">Duplicate pattern</button>`:''}</div></div>`).join('')}`}function openProject(id){let p=db.projects.find(x=>x.id===id);if(!p)return;state=p;db.activeId=id;mirrorPreview=false;compareA=null;compareB=null;tab='home';save();window.scrollTo(0,0)}function newProject(duplicate){let id='blanket-'+Date.now(),base=duplicate?state.sections.map(s=>({...s})):[];let p={id,name:duplicate?state.name+' — New Version':'Blanket #'+String(db.projects.length+1).padStart(3,'0'),width:60,length:60,pegs:36,done:false,started:false,currentRow:0,photo:'',sections:base,usage:{},notes:'',giftedTo:''};db.projects.push(p);db.activeId=id;state=p;mirrorPreview=false;compareA=null;compareB=null;tab='design';save();window.scrollTo(0,0)}function duplicateProject(id){let p=db.projects.find(x=>x.id===id);if(p){state=p;newProject(true)}}
function render(){$('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('view').innerHTML=({home,projects,design,knit,stash,scan,receipt})[tab]()}$('tabs').addEventListener('click',e=>{let b=e.target.closest('button[data-tab]');if(b)go(b.dataset.tab)});document.addEventListener('click',e=>{let b=e.target.closest('[data-row-action]');if(!b)return;let max=totalRows();state.currentRow=Math.max(0,Math.min(max,Number(state.currentRow||0)+(b.dataset.rowAction==='plus'?1:-1)));save()});document.addEventListener('change',e=>{if(!e.target.matches('[data-row-jump]'))return;state.currentRow=Math.max(0,Math.min(totalRows(),Number(e.target.value)||0));save()});$('restore').onclick=()=>{if(confirm('Restore from a Chunky backup? This replaces projects and stash on this website.'))$('importFile').click()};$('importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(Array.isArray(x.projects)&&Array.isArray(x.yarn)){db=x}else if(x.sections&&Array.isArray(x.yarn)){db={version:2,activeId:'restored-001',yarn:x.yarn,projects:[{...x,id:'restored-001',usage:Object.fromEntries(x.yarn.map(y=>[y.id,Math.max(0,y.bought-y.left)]))}]}}else throw Error('Not a Chunky backup');state=db.projects.find(p=>p.id===db.activeId)||db.projects[0];db.activeId=state.id;tab='projects';save();alert('Backup restored!')}catch(err){alert('Could not restore: '+err.message)}e.target.value=''});$('export').onclick=()=>download('chunky-all-projects-backup.json',JSON.stringify(db,null,2),'application/json');

const priorHome=baseHome, priorProjects=baseProjects, priorKnit=baseKnit;
const todayLocal=()=>new Date().toLocaleDateString('en-CA');
function projectCost(p){return db.yarn.reduce((sum,y)=>sum+Number((p.usage||{})[y.id]||0)*Number(y.price||0),0)}
function photoFor(p){return p.photo?`<img src="${p.photo}" alt="Finished photo of ${esc(p.name)}" style="width:100%;max-height:340px;object-fit:cover;border-radius:15px">`:`<div style="padding:26px;background:#eee4d8;border-radius:15px;text-align:center">🧶<p class="hint">Add your finished blanket photo</p></div>`}
function finishForm(){return `<div class="panel" style="background:#f3e9df"><h2>🎁 Finish blanket & save its story</h2><p class="hint">Save the final details, photo and actual yarn usage. Nothing is removed from your stash automatically.</p><div class="field"><label>Blanket name</label><input value="${esc(state.name)}" oninput="state.name=this.value"></div><div class="flex"><div class="field"><label>Length (inches)</label><input type="number" min="1" step="0.5" value="${Number(state.length)||''}" oninput="state.length=Number(this.value)"></div><div class="field"><label>Width (inches)</label><input type="number" min="1" step="0.5" value="${Number(state.width)||''}" oninput="state.width=Number(this.value)"></div></div><div class="field"><label>Finished date</label><input type="date" value="${esc(state.finishedDate||todayLocal())}" oninput="state.finishedDate=this.value"></div><div class="field"><label>Gifted to (optional)</label><input placeholder="Who gets this cozy masterpiece?" value="${esc(state.giftedTo||'')}" oninput="state.giftedTo=this.value"></div><div class="field"><label>Photo of finished blanket</label><input type="file" accept="image/*" onchange="uploadPhoto(this)"></div>${state.photo?`<img src="${state.photo}" alt="Finished blanket photo" style="width:120px;height:120px;object-fit:cover;border-radius:12px">`:''}<h3>Yarn actually used</h3><p class="hint">Enter skeins consumed, including partial skeins (e.g., 1.5). This calculates your receipt; it won't double-deduct your inventory.</p>${db.yarn.map(y=>`<div class="flex" style="align-items:center;margin:8px 0"><span class="swatch" style="background:${y.color}"></span><label style="flex:1">${esc(y.name)}</label><input aria-label="${esc(y.name)} skeins used" style="max-width:100px" type="number" min="0" step="0.1" value="${Number((state.usage||{})[y.id]||0)}" oninput="state.usage=state.usage||{};state.usage['${y.id}']=Math.max(0,Number(this.value)||0)"></div>`).join('')}<div class="field"><label>Memory / notes</label><textarea rows="3" oninput="state.notes=this.value">${esc(state.notes||'')}</textarea></div><p><strong>Estimated yarn cost: ${money(projectCost(state))}</strong> <span class="hint">(updates after saving)</span></p><div class="flex"><button onclick="finishBlanket()">🎉 Finish & save to scrapbook</button><button class="secondary" onclick="save();go('projects')">Save details for later</button></div></div>`}
function finishBlanket(){if(!state.name.trim()){alert('Give your blanket a name first.');return}if(!(state.width>0&&state.length>0)){alert('Enter the finished width and length.');return}if(!confirm('Mark this blanket complete and add it to your scrapbook? You can edit its story later.'))return;state.done=true;state.started=true;state.finishedDate=state.finishedDate||todayLocal();state.finishedRows=Number(state.currentRow||totalRows());db.version=7;save();go('scrapbook')}
function scrapbook(){let completed=db.projects.filter(p=>p.done);return `<div class="panel"><h1>🎁 My Blanket Scrapbook</h1><p class="muted">The cozy history of everything you've made and gifted.</p><div class="flex"><button onclick="go('projects')">+ New blanket</button><button class="secondary" onclick="go('receipt')">Current blanket receipt</button></div></div>${completed.length?completed.map(p=>`<div class="panel"><div class="grid" style="align-items:start"><div>${photoFor(p)}</div><div><span class="pill">✓ FINISHED</span><h2>${esc(p.name)}</h2><p><strong>${esc(p.length||'—')}″ × ${esc(p.width||'—')}″</strong></p><p>📅 ${esc(p.finishedDate||'Date not recorded')}</p><p>🎁 ${p.giftedTo?'Gifted to '+esc(p.giftedTo):'Recipient not recorded'}</p><p>🧶 ${db.yarn.reduce((n,y)=>n+Number((p.usage||{})[y.id]||0),0).toFixed(1)} skeins · ${money(projectCost(p))} estimated</p><p class="hint">${esc(p.notes||'')}</p><div class="flex"><button onclick="openProject('${p.id}');go('story')">Open scrapbook entry</button><button class="secondary" onclick="duplicateProject('${p.id}')">Use this pattern again</button></div></div></div></div>`).join(''):`<div class="panel"><h2>No finished blankets yet</h2><p>Open a project and tap Finish blanket when you're done.</p></div>`}`}
function story(){return `<div class="panel"><button class="secondary small" onclick="go('scrapbook')">← Scrapbook</button><h1>${esc(state.name)} 🧶</h1>${photoFor(state)}<div class="metrics"><div class="metric"><strong>${esc(state.length||'—')}″ × ${esc(state.width||'—')}″</strong><span>Finished size</span></div><div class="metric"><strong>${money(projectCost(state))}</strong><span>Yarn cost estimate</span></div></div><p>📅 ${esc(state.finishedDate||'Date not recorded')} · 🎁 ${esc(state.giftedTo||'Recipient not recorded')}</p><p>${esc(state.notes||'')}</p><h3>Yarn used</h3>${db.yarn.filter(y=>Number((state.usage||{})[y.id]||0)>0).map(y=>`<div class="row"><span class="swatch" style="background:${y.color}"></span><div class="grow">${esc(y.name)}</div><strong>${Number(state.usage[y.id])} skeins · ${money(Number(state.usage[y.id])*Number(y.price||0))}</strong></div>`).join('')}<h3>Pattern</h3>${preview(state.sections,true)}<div class="flex"><button onclick="go('storyEdit')">✏️ Edit story / add photo</button><button class="secondary" onclick="go('receipt')">💰 Receipt</button><button class="secondary" onclick="duplicateProject('${state.id}')">Duplicate pattern</button></div></div>`}
function storyEdit(){return `<div class="panel"><button class="secondary small" onclick="go('story')">← Back</button><h1>Edit scrapbook entry</h1><p class="hint">You can update photos, recipient, dimensions and usage after finishing.</p></div>${finishForm()}`}
function home(){let base=priorHome();return state.done?base.replace('<div class="panel"><h2>What do you want to do?</h2>',`<div class="panel"><button onclick="go('story')">🎁 View scrapbook entry</button> <button class="secondary" onclick="go('storyEdit')">✏️ Edit finished details</button></div><div class="panel"><h2>What do you want to do?</h2>`):base.replace('<div class="panel"><h2>What do you want to do?</h2>',`<div class="panel"><button onclick="go('finish')">🎉 Finish blanket & save to scrapbook</button></div><div class="panel"><h2>What do you want to do?</h2>`)}
function projects(){return priorProjects()+`<div class="panel"><button onclick="go('scrapbook')">🎁 View finished blanket scrapbook</button>${!state.done?` <button class="secondary" onclick="go('finish')">🎉 Finish current blanket</button>`:''}</div>`}
function knit(){return priorKnit()+(!state.done?`<div class="panel"><h2>Finished knitting?</h2><button onclick="go('finish')">🎉 Finish blanket → Scrapbook</button></div>`:'')}
const priorRender=render;
render=function(){if(['scrapbook','story','storyEdit','finish'].includes(tab)){$('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab==='scrapbook'));$('view').innerHTML=({scrapbook,story,storyEdit,finish:finishForm})[tab]();return}priorRender()};
if(!document.querySelector('[data-tab="scrapbook"]')){let b=document.createElement('button');b.dataset.tab='scrapbook';b.textContent='🎁 Scrapbook';$('tabs').appendChild(b)}
// Preserve existing stored project fields; add a completion date only if it was explicitly known.

render();
// v0.8: per-project actual purchase prices, sale batches and leftovers.
// All new fields are optional; old v0.6/v0.7 backups continue to work.
function effectiveUnitPrice(p,y){let v=(p.actualPrices||{})[y.id];return v!==undefined&&v!==''&&Number.isFinite(Number(v))?Number(v):Number(y.price||0)}
function projectCost(p){return db.yarn.reduce((sum,y)=>sum+Number((p.usage||{})[y.id]||0)*effectiveUnitPrice(p,y),0)}
function cost(){return projectCost(state)}
function priceEdit(id,val){state.actualPrices=state.actualPrices||{};if(val==='')delete state.actualPrices[id];else state.actualPrices[id]=Math.max(0,Number(val)||0);save()}
function leftoverEdit(id,val){state.leftovers=state.leftovers||{};if(val==='')delete state.leftovers[id];else state.leftovers[id]=Math.max(0,Number(val)||0);save()}
function priceTracker(){let p=state;return `<div class="panel"><h1>💰 Yarn Costs & Leftovers</h1><p class="muted">Record what you ACTUALLY paid for this blanket, even if the same yarn costs more next week. Prices here belong to this project only.</p><h2>${esc(p.name)}</h2><div class="panel" style="background:#f1e7dc"><h2 style="margin:0">${money(projectCost(p))}</h2><p class="hint">Estimated yarn used · excludes tax, shipping and your time</p></div>${db.yarn.map(y=>{let u=Number((p.usage||{})[y.id]||0),price=effectiveUnitPrice(p,y),left=(p.leftovers||{})[y.id];return `<div class="panel" style="background:#faf6f0"><h3><span class="swatch" style="background:${y.color}"></span> ${esc(y.name)}</h3><p class="hint">${esc(y.brand||'Brand not recorded')} · Stash price ${money(y.price)} / skein · ${Number(y.left||0)} in stash</p><div class="flex"><div class="field"><label>Skeins used</label><input type="number" min="0" step="0.1" value="${u}" onchange="state.usage=state.usage||{};state.usage['${y.id}']=Math.max(0,Number(this.value)||0);save()"></div><div class="field"><label>Actual cost per skein ($)</label><input type="number" min="0" step="0.01" value="${price.toFixed(2)}" onchange="priceEdit('${y.id}',this.value)"></div><div class="field"><label>Leftover skeins (optional)</label><input type="number" min="0" step="0.1" placeholder="Not recorded" value="${left===undefined?'':Number(left)}" onchange="leftoverEdit('${y.id}',this.value)"></div></div><p><strong>Cost for this yarn: ${money(u*price)}</strong></p></div>`}).join('')}<div class="panel"><h2>🛍️ Sale vs. regular price</h2><p>For Hobby Lobby sale weeks or Amazon deals, add each purchase as a separate batch in Yarn Stash. This keeps the price you actually paid instead of changing the price of your older yarn.</p><button onclick="go('stash')">+ Add purchase batch</button></div><div class="panel"><h2>🧶 Leftover bin</h2><p class="hint">These are project notes, not automatic deductions from your stash. Update your stash quantities when you're ready.</p>${db.yarn.filter(y=>(p.leftovers||{})[y.id]!==undefined).map(y=>`<p>${esc(y.name)}: <strong>${Number(p.leftovers[y.id])} skeins</strong></p>`).join('')||'<p>No leftovers logged yet.</p>'}<button class="secondary" onclick="download('chunky-'+state.id+'-costs.txt',receiptText(),'text/plain')">↓ Export costs</button></div></div>`}
const priorReceipt08=receipt;
receipt=function(){return priorReceipt08()+`<div class="panel" style="background:#f1e7dc"><h2>Paid a different price?</h2><p>Track sale prices and leftovers for this specific blanket without changing other projects.</p><button onclick="go('costs')">💰 Edit actual costs & leftovers</button></div>`};
receiptText=function(){return `CHUNKY — ${state.name}\nSize: ${state.length} x ${state.width} inches\n${db.yarn.map(y=>`${y.name}: ${Number((state.usage||{})[y.id]||0)} skeins x ${money(effectiveUnitPrice(state,y))} = ${money(Number((state.usage||{})[y.id]||0)*effectiveUnitPrice(state,y))}${(state.leftovers||{})[y.id]!==undefined?' | leftover: '+state.leftovers[y.id]+' skeins':''}`).join('\n')}\nEstimated yarn cost: ${money(projectCost(state))}\nGifted to: ${state.giftedTo||'Not entered'}\nNotes: ${state.notes||''}\n`};
const priorRender08=render;
render=function(){if(tab==='costs'){$('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab==='costs'));$('view').innerHTML=priceTracker();return}priorRender08()};
if(!document.querySelector('[data-tab="costs"]')){let b=document.createElement('button');b.dataset.tab='costs';b.textContent='💰 Costs & Leftovers';$('tabs').appendChild(b)}


// v0.9 Inspiration Gallery. No existing project is changed until a design is explicitly applied.
let galleryColors=[],galleryOptions=[],gallerySeed=0;
function gallerySelected(){let valid=galleryColors.filter(id=>db.yarn.some(y=>y.id===id));if(valid.length)return valid;let current=[...new Set(state.sections.map(s=>s.yarn))].filter(id=>db.yarn.some(y=>y.id===id));return current.length?current.slice(0,5):db.yarn.slice(0,3).map(y=>y.id)}
function toggleGalleryColor(id){let chosen=gallerySelected();galleryColors=chosen.includes(id)?chosen.filter(x=>x!==id):chosen.concat(id);if(!galleryColors.length)galleryColors=[id];galleryOptions=[];render()}
function galleryGenerate(){gallerySeed++;let ids=gallerySelected();if(!ids.length){alert('Add yarn to your stash first.');return}let len=ids.length;let pick=i=>ids[((i%len)+len)%len];let shift=gallerySeed%len;let make=(sizes,offset=0)=>sizes.map((n,i)=>({yarn:pick(i+shift+offset),rows:n}));let symmetrical=half=>half.concat(half.slice().reverse().map(s=>({...s})));
let base=[7,13,7,13,2,2,2,13];let mixed=make(base);let classics=make([8,8,8,8,8,8,8,8]);let wide=make([13,11,15,11,13,11]);let thin=make(Array(20).fill(3));let blocks=make([16,14,16,14,16],1);let asym=make([5,12,3,17,7,3,13,6,10]);let mirror=symmetrical(make([7,2,2,2,13,7]));
galleryOptions=[{name:'Classic Stripes',tag:'Cozy, balanced, timeless',sections:classics},{name:'Modern Wide Stripes',tag:'Big, bold color blocks',sections:wide},{name:'Thin Stripes',tag:'Lots of playful detail',sections:thin},{name:'Color Blocks',tag:'A statement blanket',sections:blocks},{name:'Mixed Stripes',tag:'Skinny accents + chunky blocks',sections:mixed},{name:'Perfectly Mirrored',tag:'One half reflected in the other',sections:mirror}];render()}
function galleryRequirements(sections){let totals={};for(let s of sections)totals[s.yarn]=(totals[s.yarn]||0)+Number(s.rows||0);return Object.entries(totals).map(([id,rows])=>{let y=yarn(id),g=Number(y.rowsPerSkein||0);return `${esc(y.name)}: ${rows} rows${g>0?' · ~'+(rows/g).toFixed(1)+' skeins':''}`}).join('<br>')}
function galleryUse(i){let opt=galleryOptions[i];if(!opt)return;if(state.done){alert('This blanket is completed. Open or create an unfinished project before applying a gallery design.');return}if(!confirm('Replace the stripe pattern in '+state.name+' with '+opt.name+'? Your current project will change, but your stash and other blankets will stay untouched.'))return;state.sections=opt.sections.map(s=>({...s}));state.currentRow=0;state.started=false;compareA=null;compareB=null;save();go('design')}
function gallery(){if(!galleryOptions.length){let ids=gallerySelected();if(ids.length){galleryColors=ids;galleryGenerate();return gallery()} }return `<div class="gallery-banner"><span class="pill">CHUNKY v0.9 · NEW</span><h1 style="margin:10px 0">♡ Inspiration Gallery</h1><p>Six blanket ideas using colors from YOUR stash. Tap a favorite to make it your next project.</p><p class="hint">These are illustrated knit previews, not photographs of the actual finished blanket. Yarn estimates depend on your rows-per-skein entries.</p></div><div class="panel"><h2>1. Pick your yarn colors</h2><p class="hint">Choose any colors you've saved in your stash. You can select more than three.</p><div class="gallery-controls">${db.yarn.map(y=>`<button class="gallery-color ${gallerySelected().includes(y.id)?'chosen':''}" onclick="toggleGalleryColor('${y.id}')" aria-pressed="${gallerySelected().includes(y.id)}"><span class="gallery-dot" style="background:${esc(y.color)}"></span>${esc(y.name)}</button>`).join('')}</div><div class="flex"><button onclick="galleryGenerate()">🎲 Generate six designs</button><button class="secondary" onclick="gallerySeed++;galleryOptions=[];galleryGenerate()">↻ Surprise me again</button><button class="secondary" onclick="go('stash')">+ Add yarn</button></div></div><div class="panel"><h2>2. Find your favorite</h2><div class="gallery-grid">${galleryOptions.map((o,i)=>`<div class="gallery-tile"><div class="gallery-scene">${preview(o.sections,true,'knit')}</div><div class="gallery-info"><h3>${i+1}. ${o.name}</h3><p class="hint">${o.tag}</p><p><strong>${o.sections.reduce((n,s)=>n+s.rows,0)} rows</strong> · ${o.sections.length} stripes</p><details><summary>Yarn estimate</summary><p class="gallery-estimate">${galleryRequirements(o.sections)}</p></details><button onclick="galleryUse(${i})">♡ Use this design</button></div></div>`).join('')}</div><p class="hint">Using a design replaces only the currently selected unfinished blanket's stripe pattern and resets its row counter. To keep your current design, first create a new blank project in My Blankets.</p></div>`}
const priorRender09=render;
render=function(){if(tab==='gallery'){$('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab==='gallery'));$('view').innerHTML=gallery();return}priorRender09()};
if(!document.querySelector('[data-tab="gallery"]')){let b=document.createElement('button');b.dataset.tab='gallery';b.textContent='♡ Inspiration Gallery';$('tabs').insertBefore(b,$('tabs').querySelector('[data-tab="design"]'))}
const priorDesign09=design;
design=function(){return `<div class="panel" style="background:#efe0d2"><h2>♡ Want to SEE six options?</h2><p>Try the new Inspiration Gallery using colors from your stash.</p><button onclick="go('gallery')">Open Inspiration Gallery →</button></div>`+priorDesign09()};
document.querySelector('footer').textContent='Chunky v0.9 · Back up before changing websites · Your projects stay on this device.';
